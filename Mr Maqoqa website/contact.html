<!DOCTYPE html>
<html>

<head>

    <title>My Website - Contact</title>
</head>

<body>

    <header>

        <h1>Contact Us</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About</a> |
            <a href="contact.html">Contact</a>
        </nav>

        <hr>

    </header>


    <main>

        <section>

            <h2>Contact Information</h2>

            <p>Email: info@example.com</p>

            <p>Telephone: 012 345 6789</p>

            <p>Location: Johannesburg, South Africa</p>

        </section>


        <section>

            <h2>Send Us a Message</h2>

            <form>

                <label for="fullname">Full Name:</label>
                <br>

                <input type="text"
                       id="fullname"
                       name="fullname"
                       required>

                <br><br>


                <label for="email">Email Address:</label>
                <br>

                <input type="email"
                       id="email"
                       name="email"
                       required>

                <br><br>


                <label for="phone">Phone Number:</label>
                <br>

                <input type="tel"
                       id="phone"
                       name="phone">

                <br><br>


                <label for="service">Select a Service:</label>
                <br>

                <select id="service" name="service">

                    <option value="web">Web Development</option>

                    <option value="programming">
                        Programming
                    </option>

                    <option value="database">
                        Database Development
                    </option>

                </select>

                <br><br>


                <p>Preferred Contact Method:</p>

                <input type="radio"
                       id="emailContact"
                       name="contactMethod"
                       value="Email">

                <label for="emailContact">Email</label>


                <input type="radio"
                       id="phoneContact"
                       name="contactMethod"
                       value="Phone">

                <label for="phoneContact">Phone</label>

                <br><br>


                <label for="message">Message:</label>
                <br>

                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40">
                </textarea>

                <br><br>


                <input type="submit"
                       value="Send Message">

                <input type="reset"
                       value="Clear">

            </form>

        </section>
        
        <section>
          <h1>Our Location</h1>

    <p>Find us using the map below:</p>

    <iframe
        src="https://www.google.com/maps?q=Johannesburg,South+Africa&output=embed"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>
        </section>



    </main>


    <hr>

    <footer>

        <p>&copy; 2026 My Website. All Rights Reserved.</p>

    </footer>

</body>

</html>
